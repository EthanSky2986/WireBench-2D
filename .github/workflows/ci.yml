name: Verify WireBench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/check-git-identities.mjs --history
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.12.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: npm ci
      - run: npm run package:windows
      - name: Smoke test executable
        shell: pwsh
        run: ./scripts/smoke-test-windows-launcher.ps1
