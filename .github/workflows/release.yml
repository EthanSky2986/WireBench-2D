name: Build WireBench release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: npm ci
      - run: npm run check:release-version
      - run: npm run check
      - run: node scripts/build-windows-launcher.mjs
      - name: Smoke test executable
        shell: pwsh
        run: ./scripts/smoke-test-windows-launcher.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
